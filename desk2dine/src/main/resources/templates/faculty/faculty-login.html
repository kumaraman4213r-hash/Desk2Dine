<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Faculty Login</title>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{

    width:400px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0px 0px 10px gray;

}

input{

    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;

}

button{

    width:100%;
    padding:12px;
    background:#2c3e50;
    color:white;
    border:none;
    cursor:pointer;

}

button:hover{

    background:#16a085;

}

.error{

    color:red;
    text-align:center;

}

</style>

</head>

<body>

<div class="container">

<h2 align="center">Faculty Login</h2>

<p class="error" th:text="${error}"></p>

<form action="/faculty/authenticate" method="post">

<label>Email</label>

<input type="email"
name="email"
required>

<label>Password</label>

<input type="password"
name="password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>

</html>
