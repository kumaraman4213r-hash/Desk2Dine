<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | Desk2Dine</title>

    <!-- Common CSS -->

    <link rel="stylesheet" href="/css/common/style.css">
    <link rel="stylesheet" href="/css/common/navbar.css">
    <link rel="stylesheet" href="/css/common/sidebar.css">
    <link rel="stylesheet" href="/css/common/responsive.css">

    <!-- Faculty CSS -->

    <link rel="stylesheet" href="/css/faculty/faculty-my-orders.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">

        Desk<span>2Dine</span>

    </div>

    <div class="nav-right">

        <div class="user-name">

            Welcome,

            <span th:text="${faculty.name}">Faculty</span>

        </div>

        <a href="/faculty/logout"
           class="logout-btn">

            Logout

        </a>

    </div>

</nav>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <ul>

        <li>

            <a href="/faculty/dashboard">

                🏠 Dashboard

            </a>

        </li>

        <li>

            <a href="/faculty/menu">

                🍔 Menu

            </a>

        </li>

        <li>

            <a href="/faculty/order">

                🛒 Place Order

            </a>

        </li>

        <li>

            <a href="/faculty/my-orders"
               class="active">

                📦 My Orders

            </a>

        </li>

        <li>

            <a href="#">

                💳 Bills

            </a>

        </li>

        <li>

            <a href="/faculty/logout">

                🚪 Logout

            </a>

        </li>

    </ul>

</aside>

<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">

    <h1>

        My Orders

    </h1>

    <p class="subtitle">

        View all your placed food orders.

    </p>

    <table class="order-table">

        <thead>

            <tr>

                <th>Order ID</th>
                <th>Food Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
                <th>Status</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="order : ${orderList}">

                <td th:text="${order.orderId}"></td>

                <td th:text="${order.foodName}"></td>

                <td th:text="${order.quantity}"></td>

                <td>

                    ₹ <span th:text="${order.price}"></span>

                </td>

                <td>

                    ₹ <span th:text="${order.total}"></span>

                </td>

                <td>

                    <span class="status"
                          th:text="${order.status}"></span>

                </td>

            </tr>
                    </tbody>

    </table>

</main>

</body>

</html>
