<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Faculty Registration | Desk2Dine</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width:400px;
            margin:60px auto;
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#2c3e50;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#2c3e50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1abc9c;
        }

        a{
            text-decoration:none;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Faculty Registration</h1>

    <form action="/faculty/save" method="post">

        <label>Faculty Name</label>

        <input type="text"
               name="name"
               placeholder="Enter Faculty Name"
               required>

        <label>Department</label>

        <input type="text"
               name="department"
               placeholder="Enter Department"
               required>

        <label>Mobile Number</label>

        <input type="text"
               name="mobile"
               placeholder="Enter Mobile Number"
               required>

        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="back">

        <a href="/">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
